<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>
        Enter your credentials to access your account.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Login -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Login</mat-label>

          <input
            matInput
            type="text"
            formControlName="login"
            autocomplete="username"
            required
          />

          <mat-error
            *ngIf="loginForm.controls.login.hasError('required')"
          >
            Login is required.
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>

          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
            required
          />
            <button
                mat-icon-button
                matSuffix
                type="button"
                (click)="hidePassword = !hidePassword"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          
          <mat-error
            *ngIf="loginForm.controls.password.hasError('required')"
          >
            Password is required.
          </mat-error>
        </mat-form-field>

        <!-- Error message -->
        <div *ngIf="errorMessage" class="error-message" role="alert">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
        </div>

        <!-- Submit -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="loginForm.invalid || loading || loginSuccess"
        >
          <mat-spinner
            *ngIf="loading"
            diameter="20"
          ></mat-spinner>

          <span *ngIf="!loading && !loginSuccess">Login</span>
          <span *ngIf="loginSuccess">✓ Authenticated</span>
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <span>Don't have an account?</span>
      <a mat-button routerLink="/register">Register</a>
    </mat-card-actions>

  </mat-card>
</div>
