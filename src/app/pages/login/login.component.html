<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>
        Enter your credentials to access your account.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Login -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Login</mat-label>

          <input
            matInput
            type="text"
            formControlName="login"
            autocomplete="username"
            required
          />

          <mat-error
            *ngIf="loginForm.controls.login.hasError('required')"
          >
            Login is required.
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>

          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
          />

          <mat-error
            *ngIf="loginForm.controls.password.hasError('required')"
          >
            Password is required.
          </mat-error>
        </mat-form-field>

        <!-- Error message -->
        <p
          *ngIf="errorMessage"
          class="error-message"
          role="alert"
        >
          {{ errorMessage }}
        </p>

        <!-- Submit -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="loginForm.invalid || loading || loginSuccess"
        >
          <mat-spinner
            *ngIf="loading"
            diameter="20"
          ></mat-spinner>

          <span *ngIf="!loading && !loginSuccess">Login</span>
          <span *ngIf="loginSuccess">✓ Authenticated</span>
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <span>Don't have an account?</span>
      <a mat-button routerLink="/register">Register</a>
    </mat-card-actions>

  </mat-card>
</div>
